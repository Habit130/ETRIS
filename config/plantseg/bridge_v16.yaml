DATA:
  dataset: plantseg
  train_lmdb: ../plantseg/lmdb/train.lmdb
  train_split: train
  val_lmdb: ../plantseg/lmdb/val.lmdb
  val_split: val
  mask_root: ../plantseg/ann
TRAIN:
  # Base Arch
  clip_pretrain: pretrain/ViT-B-16.pt
  input_size: 416
  word_len: 77
  word_dim: 512
  ladder_dim: 64
  nhead: 8
  multi_stage: 3
  stride: [1, 1, 1]
  vis_dim: 512
  fpn_in: [768, 768, 512]
  fpn_out: [256, 512, 1024]
  sync_bn: False
  # Decoder
  num_layers: 3
  num_head: 8
  dim_ffn: 512
  dropout: 0.1
  intermediate: False
  # Training Setting
  workers: 8
  workers_val: 4
  epochs: 50
  milestones: [35]
  start_epoch: 0
  batch_size: 8
  batch_size_val: 8
  base_lr: 0.0001
  lr_decay: 0.1
  lr_multi: 1
  weight_decay: 0.
  max_norm: 0.
  manual_seed: 0
  print_freq: 100
  pred_threshold: 0.35
  # Resume & Save
  exp_name: plantseg_v16
  output_folder: exp/plantseg
  save_freq: 1
  weight:
  resume:
  evaluate: True
Distributed:
  dist_url: tcp://localhost:3681
  dist_backend: 'nccl'
  multiprocessing_distributed: True
  world_size: 1
  rank: 0
TEST:
  test_split: test
  test_lmdb: ../plantseg/lmdb/test.lmdb
  visualize: False
  save_pred_masks: True
  pred_mask_dirname: pred_masks
